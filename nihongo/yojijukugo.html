<!doctype html>
<html lang="en" data-accent="nihongo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>โยจิจุคุโกะ — Kagami Nihongo</title>
    <link rel="stylesheet" href="/assets/style.css">
    <script>if(localStorage.theme)document.documentElement.dataset.theme=localStorage.theme</script>
</head>
<body>
    <aside class="side-nav"></aside>

    <main class="workspace split">
        <section class="pane pane-form">
            <div class="card">
                <div class="card-head">
                    <h2>Basic Information</h2>
                </div>
                <div class="card-body stack">
                    <div class="grid-3">
                        <div class="field">
                            <label for="japanese-text">Japanese Text</label>
                            <input type="text" id="japanese-text" lang="ja">
                        </div>
                        <div class="field">
                            <label for="hiragana-text">Hiragana</label>
                            <input type="text" id="hiragana-text" lang="ja">
                        </div>
                        <div class="field">
                            <label for="romaji-text">Romaji</label>
                            <input type="text" id="romaji-text">
                        </div>
                    </div>
                    <div class="field">
                        <label for="gametitle">Game Title</label>
                        <input type="text" id="gametitle">
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-head"><h2 lang="th">ความหมาย</h2></div>
                <textarea id="meaning" class="bare" spellcheck="false" style="min-height: 100px;"></textarea>
            </div>

            <div class="card">
                <div class="card-head"><h2 lang="th">คำอธิบาย</h2></div>
                <textarea id="description" class="bare" spellcheck="false" style="min-height: 400px;"></textarea>
            </div>
        </section>

        <aside class="pane pane-preview">
            <div class="pane-head">
                <h2>Preview</h2>
                <span class="char-count" id="charCount"></span>
            </div>
            <pre id="preview"></pre>
            <div class="pane-foot">
                <button class="btn-danger" id="clearBtn">Clear Draft</button>
                <button class="btn" id="copyBtn">Copy to Clipboard</button>
            </div>
        </aside>
    </main>

    <script src="/assets/app.js"></script>
    <script>
        setupGenerator(() => {
            let output = `【VOCABULARY】 ⇒ คำประสม 4 ตัวอักษร\n\n${$id('japanese-text').value}\n${$id('hiragana-text').value}\n${$id('romaji-text').value}`;

            output += `\n\n————————————\n➡️ ความหมาย\n\n${$id('meaning').value}`;

            output += `\n\n————————————\n➡️ คำอธิบาย\n\n${$id('description').value}`;

            output += `\n\n————————————
四字熟語 (よじじゅくご) - คำประสมชนิดหนึ่งที่เกิดจากการนำอักษรคันจิ 4 ตัวมารวมกันเป็นคำศัพท์ใหม่หนึ่งคำที่มีความหมายใหม่\n\n————————————\n▍ภาพจากเกม ${$id('gametitle').value}`;

            return output;
        });
    </script>
</body>
</html>
